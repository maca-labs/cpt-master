<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" role="img" aria-labelledby="title">
  <title id="title">有酸素インターバルの変更前後</title>
  <rect width="100%" height="100%" rx="12" fill="#fff"/>
