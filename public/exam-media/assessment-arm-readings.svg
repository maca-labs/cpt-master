<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 286" role="img" aria-labelledby="title">
  <title id="title">診察室血圧の記録例</title>
  <rect width="100%" height="100%" rx="12" fill="#fff"/>
  <g font-family="Yu Gothic, Meiryo, sans-serif" font-size="22" fill="#18232a">
    <text x="32" y="39" font-weight="700">初回の測定記録</text>
    <text x="529" y="39" text-anchor="end" font-size="16">mmHg</text>
    <text x="254" y="85" text-anchor="middle">測定①</text>
    <text x="421" y="85" text-anchor="middle">再測定</text>
    <rect x="28" y="103" width="504" height="64" rx="4" fill="#edf3f6" />
    <rect x="28" y="179" width="504" height="64" rx="4" fill="#edf3f6" />
    <text x="57" y="143" font-weight="700">左腕</text>
    <text x="57" y="219" font-weight="700">右腕</text>
    <text x="254" y="143" text-anchor="middle">118 / 72</text>
    <text x="421" y="143" text-anchor="middle">120 / 72</text>
    <text x="254" y="219" text-anchor="middle">128 / 78</text>
    <text x="421" y="219" text-anchor="middle">126 / 76</text>
  </g>
</svg>
