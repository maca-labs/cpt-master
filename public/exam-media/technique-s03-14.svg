<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 325" role="img">
  <title>ピストン式器具の変更候補</title>
  <rect width="680" height="325" rx="16" fill="#f8fbfb"/>
  <g font-family="system-ui,'Yu Gothic',sans-serif">
  <text x="29" y="43" font-size="23" fill="#173440">ピストン式器具の変更候補</text>
  <text x="69" y="92" font-size="18" fill="#1c6975">A</text><circle cx="99" cy="144" r="7" fill="#1c6975"/><line x1="99" y1="144" x2="172" y2="105" stroke="#1c6975" stroke-width="4" stroke-linecap="round"/><circle cx="172" cy="105" r="7" fill="#1c6975"/><text x="283" y="92" font-size="18" fill="#9a4e32">B</text><circle cx="313" cy="144" r="7" fill="#1c6975"/><line x1="313" y1="144" x2="428" y2="105" stroke="#1c6975" stroke-width="4" stroke-linecap="round"/><circle cx="428" cy="105" r="7" fill="#9a4e32"/><text x="495" y="92" font-size="18" fill="#4e5487">C</text><rect x="537" y="98" width="96" height="41" rx="6" fill="#e6eeee" stroke="#1c6975" stroke-width="2"/><text x="545" y="125" font-size="18" fill="#4e5487">表示単位</text>
  <rect x="29" y="171" width="622" height="28" rx="6" fill="#f0f6f6" stroke="#d8e6e7" stroke-width="2"/><text x="43" y="191" font-size="16" fill="#173440">A てこの長さを短くする</text>
<rect x="29" y="201" width="622" height="28" rx="6" fill="#f0f6f6" stroke="#d8e6e7" stroke-width="2"/><text x="43" y="221" font-size="16" fill="#173440">B てこの長さを長くする</text>
<rect x="29" y="231" width="622" height="28" rx="6" fill="#f0f6f6" stroke="#d8e6e7" stroke-width="2"/><text x="43" y="251" font-size="16" fill="#173440">C 表示の単位を変える</text>
<rect x="29" y="261" width="622" height="28" rx="6" fill="#f0f6f6" stroke="#d8e6e7" stroke-width="2"/><text x="43" y="281" font-size="16" fill="#173440">同じ可動域と速度を使用</text>
  </g>
</svg>
