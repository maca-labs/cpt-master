<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 295" role="img">
  <title>サスペンションの2人分の荷重試験</title>
  <rect width="680" height="295" rx="16" fill="#f8fbfb"/>
  <g font-family="system-ui,'Yu Gothic',sans-serif">
  <text x="29" y="43" font-size="23" fill="#173440">サスペンションの2人分の荷重試験</text>
  <text x="87" y="92" font-size="18" fill="#1c6975">A</text><line x1="107" y1="80" x2="257" y2="80" stroke="#80959c" stroke-width="4" stroke-linecap="round"/><circle cx="167" cy="80" r="7" fill="#1c6975"/><circle cx="167" cy="80" r="7" fill="#1c6975"/><line x1="167" y1="80" x2="129" y2="135" stroke="#1c6975" stroke-width="4" stroke-linecap="round"/><line x1="167" y1="80" x2="224" y2="135" stroke="#1c6975" stroke-width="4" stroke-linecap="round"/><line x1="118" y1="135" x2="140" y2="135" stroke="#9a4e32" stroke-width="4" stroke-linecap="round"/><line x1="213" y1="135" x2="235" y2="135" stroke="#9a4e32" stroke-width="4" stroke-linecap="round"/><line x1="212" y1="152" x2="231" y2="152" stroke="#9a4e32" stroke-width="2" stroke-linecap="round"/><text x="381" y="92" font-size="18" fill="#9a4e32">B</text><line x1="401" y1="80" x2="551" y2="80" stroke="#80959c" stroke-width="4" stroke-linecap="round"/><circle cx="461" cy="80" r="7" fill="#1c6975"/><circle cx="461" cy="80" r="7" fill="#1c6975"/><line x1="461" y1="80" x2="423" y2="135" stroke="#1c6975" stroke-width="4" stroke-linecap="round"/><line x1="461" y1="80" x2="518" y2="135" stroke="#1c6975" stroke-width="4" stroke-linecap="round"/><line x1="412" y1="135" x2="434" y2="135" stroke="#9a4e32" stroke-width="4" stroke-linecap="round"/><line x1="507" y1="135" x2="529" y2="135" stroke="#9a4e32" stroke-width="4" stroke-linecap="round"/><line x1="422" y1="139" x2="417" y2="161" stroke="#9a4e32" stroke-width="4" stroke-linecap="round"/><path d="M-12 -6L0 0L-12 6Z" fill="#9a4e32" transform="translate(417 161) rotate(102.80426606528675)"/><line x1="518" y1="139" x2="523" y2="161" stroke="#9a4e32" stroke-width="4" stroke-linecap="round"/><path d="M-12 -6L0 0L-12 6Z" fill="#9a4e32" transform="translate(523 161) rotate(77.19573393471325)"/>
  <rect x="29" y="171" width="622" height="28" rx="6" fill="#f0f6f6" stroke="#d8e6e7" stroke-width="2"/><text x="43" y="191" font-size="16" fill="#173440">A 固定点だけを目視し、ストラップにはまだ荷重をかけていない</text>
<rect x="29" y="201" width="622" height="28" rx="6" fill="#f0f6f6" stroke="#d8e6e7" stroke-width="2"/><text x="43" y="221" font-size="16" fill="#173440">B 取り付け後に両ストラップを強く引いて固定を確認した</text>
<rect x="29" y="231" width="622" height="28" rx="6" fill="#f0f6f6" stroke="#d8e6e7" stroke-width="2"/><text x="43" y="251" font-size="16" fill="#173440">器具と床の目視点検は完了</text>
  </g>
</svg>
