<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 288" role="img" aria-labelledby="title">
  <title id="title">歩行方向と検者の候補位置</title>
  <rect width="100%" height="100%" rx="12" fill="#fff"/>
  <g font-family="Yu Gothic, Meiryo, sans-serif" font-size="22" fill="#18232a">
    <text x="30" y="39" font-weight="700">歩行路の上面図</text>
    <rect x="27" y="65" width="506" height="186" rx="4" fill="#edf3f6" />
    <line x1="129" y1="144" x2="446" y2="144" stroke="#46515d" stroke-width="3" stroke-dasharray="8 7"/>
    <path d="M419 126 L446 144 L419 162" fill="none" stroke="#46515d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="454" y="193" text-anchor="end" font-size="16">進行方向</text>
    <circle cx="271" cy="144" r="25" fill="#17617a" />
    <text x="271" y="151" text-anchor="middle" fill="#fff" font-weight="700">歩</text>
    <circle cx="389" cy="144" r="21" fill="#fff" stroke="#18232a" stroke-width="2"/>
    <text x="389" y="151" text-anchor="middle" font-weight="700">A</text>
    <circle cx="271" cy="207" r="21" fill="#fff" stroke="#18232a" stroke-width="2"/>
    <text x="271" y="214" text-anchor="middle" font-weight="700">B</text>
    <circle cx="149" cy="144" r="21" fill="#fff" stroke="#18232a" stroke-width="2"/>
    <text x="149" y="151" text-anchor="middle" font-weight="700">C</text>
    <text x="31" y="275" font-size="16">歩＝歩行者。A・B・Cは検者の候補位置。</text>
  </g>
</svg>
