<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" role="img" aria-labelledby="title">
  <title id="title">ケトルベルスイングの切り返しを横から観察した動き</title>
  <rect width="520" height="250" rx="12" fill="#f6fafc"/>
  <g fill="#183241" font-family="sans-serif" text-anchor="middle">
    <text x="260" y="32" font-size="18">後方から前方への切り返し</text>
    <text x="260" y="240" font-size="14">ベルの位置と肩・股関節・膝に注目</text>
  </g>
  <path d="M128 218H418" stroke="#506573" stroke-width="3"/>
  <g fill="none" stroke="#183d52" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="288" cy="66" r="15" fill="#fff" stroke-width="4"/>
    <polyline points="275,80 220,136 268,163 246,216 282,216"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="4.8s" keyTimes="0;.21;.69;.94;.941;1" values="0 275 80;0 275 80;-104 275 80;-104 275 80;0 275 80;0 275 80" repeatCount="indefinite"/>
      <polyline points="275,80 258,125 241,169" stroke="#236b84"/>
      <circle cx="238" cy="180" r="12" fill="#a64822" stroke="#fff" stroke-width="2"/>
    </g>
  </g>
</svg>
