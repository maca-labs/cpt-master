<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" role="img" aria-labelledby="title">
  <title id="title">三本の20メートル区間の平均走速度</title>
  <rect width="100%" height="100%" rx="12" fill="#fff"/>
  <g font-family="Yu Gothic, Meiryo, sans-serif" font-size="22" fill="#18232a">
    <text x="28" y="37" font-weight="700">20 m区間の平均走速度</text>
    <text x="28" y="63" font-size="16">速度（m/秒）</text>
    <line x1="85" y1="252" x2="515" y2="252" stroke="#46515d" stroke-width="2"/>
    <line x1="85" y1="89" x2="85" y2="252" stroke="#46515d" stroke-width="2"/>
    <line x1="85" y1="106" x2="515" y2="106" stroke="#b9c7d0"/>
    <text x="74" y="111" text-anchor="end" font-size="16">8.0</text>
    <line x1="85" y1="178" x2="515" y2="178" stroke="#b9c7d0"/>
    <text x="74" y="183" text-anchor="end" font-size="16">7.6</text>
    <line x1="85" y1="250" x2="515" y2="250" stroke="#b9c7d0"/>
    <text x="74" y="255" text-anchor="end" font-size="16">7.2</text>
    <line x1="168" y1="160" x2="168" y2="252" stroke="#46515d" stroke-width="2"/>
    <circle cx="168" cy="160" r="9" fill="#17617a" />
    <text x="168" y="144" text-anchor="middle" font-weight="700">7.7</text>
    <text x="168" y="282" text-anchor="middle" font-size="16">1本目</text>
    <line x1="300" y1="196" x2="300" y2="252" stroke="#46515d" stroke-width="2"/>
    <circle cx="300" cy="196" r="9" fill="#17617a" />
    <text x="300" y="180" text-anchor="middle" font-weight="700">7.5</text>
    <text x="300" y="282" text-anchor="middle" font-size="16">2本目</text>
    <line x1="430" y1="142" x2="430" y2="252" stroke="#46515d" stroke-width="2"/>
    <circle cx="430" cy="142" r="9" fill="#17617a" />
    <text x="430" y="126" text-anchor="middle" font-weight="700">7.8</text>
    <text x="430" y="282" text-anchor="middle" font-size="16">3本目</text>
    <text x="29" y="322" font-size="16">点の位置は縦軸の7.2〜8.0 m/秒に対応。</text>
  </g>
</svg>
