<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="title">
  <title id="title">握力計2台の測定差と許容範囲</title>
  <rect width="100%" height="100%" rx="12" fill="#fff"/>
  <g font-family="Yu Gothic, Meiryo, sans-serif" font-size="22" fill="#18232a">
    <text x="29" y="40" font-weight="700">同じ人を2台で測定したときの差</text>
    <text x="27" y="98" font-size="16">一致限界</text>
    <text x="27" y="165" font-size="16">許容範囲</text>
    <line x1="299" y1="70" x2="299" y2="215" stroke="#46515d" stroke-dasharray="5 5"/>
    <line x1="130" y1="106" x2="475" y2="106" stroke="#17617a" stroke-width="10" stroke-linecap="round"/>
    <line x1="230" y1="172" x2="368" y2="172" stroke="#a04421" stroke-width="10" stroke-linecap="round"/>
    <circle cx="302" cy="106" r="8" fill="#fff" stroke="#18232a" stroke-width="3"/>
    <text x="130" y="88" text-anchor="middle" font-size="16">−4.9</text>
    <text x="475" y="88" text-anchor="middle" font-size="16">+5.1</text>
    <text x="230" y="155" text-anchor="middle" font-size="16">−2</text>
    <text x="368" y="155" text-anchor="middle" font-size="16">+2</text>
    <text x="299" y="232" text-anchor="middle" font-size="16">0 kg</text>
    <text x="29" y="270" font-size="16">○は平均差 +0.1 kg。</text>
  </g>
</svg>
